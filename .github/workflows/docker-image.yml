name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout SCM
    - uses: actions/checkout@v4
    
    - name: Build the Docker image
      run: docker build -t naufalamri/dumbflix-backend .
    
    - name: Docker Login 
      with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker Push
      run: docker build -t naufalamri/dumbflix-backend





